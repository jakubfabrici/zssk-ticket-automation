{% extends "base.html" %}
{% block title %}Nastavenie hesla{% endblock %}
{% block content %}
<h1>Nastav si heslo ({{ uid }})</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="token" value="{{ token }}">
  <label>Heslo (aspoň 8 znakov) <input type="password" name="password" required></label>
  <label>Heslo znova <input type="password" name="password2" required></label>
  <button type="submit">Uložiť a prihlásiť</button>
</form>
{% endblock %}
